name: Publish to npm

# Trusted publishing (GitHub OIDC): no npm token is stored in this repository.
#
# One-time setup (already done for dsh-preset-builder):
#
#   npm trust github dsh-preset-builder \
#     --file publish.yml \
#     --repo cningan/dsh-preset-studio \
#     --env npm-publish \
#     --allow-publish \
#     --registry https://registry.npmjs.org/
#
# The repository variable NPM_TRUSTED_PUBLISHER_READY gates the publish step so
# a tag push only runs checks until the npm relationship is armed. A tag must
# equal bundle/package.json's version; mismatch fails before publishing.
#
# Release flow:
#   cd bundle && npm version patch   # bumps version, commits, creates vX.Y.Z
#   git push --follow-tags           # CI publishes and opens the GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # open the GitHub Release
  id-token: write # exchange the GitHub OIDC token for an npm publish credential

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches bundle/package.json
        run: |
          version="$(node -p "require('./bundle/package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match bundle/package.json version v$version" >&2
            exit 1
          fi

      # Fail loudly instead of 404-ing mysteriously: an npm without OIDC sends
      # the publish unauthenticated, and the registry answers only "404 PUT".
      - name: Assert npm can do OIDC
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true'
        run: |
          npm_version="$(npm --version)"
          echo "node $(node --version) / npm $npm_version"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1, so it cannot exchange an OIDC token`);
              process.exit(1);
            }
          ' "$npm_version"

      - name: Install runtime dependencies
        working-directory: bundle
        run: npm install --no-audit --no-fund

      - name: Check
        run: |
          node --check bundle/client.js
          node --check bundle/index.js

      - name: Test
        run: node test/unit.mjs

      - name: Explain the gate
        if: vars.NPM_TRUSTED_PUBLISHER_READY != 'true'
        run: |
          echo "::notice title=Publish skipped::Trusted publishing is not armed yet."
          echo "Create the npm trusted publisher relationship for publish.yml and set"
          echo "the repository variable NPM_TRUSTED_PUBLISHER_READY to true."

      # --loglevel=verbose is deliberate: the npm CLI swallows OIDC failures at
      # the default level, so a rejected token exchange is otherwise invisible.
      - name: Publish
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true'
        working-directory: bundle
        run: npm publish --provenance --access public --loglevel=verbose

      # npm accepts a new package version asynchronously; wait before creating
      # the Release so an early check does not read a temporary 404 as failure.
      # A timeout is a warning, not a failure: the publish already succeeded.
      - name: Wait for the registry
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./bundle/package.json').version")"
          for attempt in $(seq 1 40); do
            if npm view "dsh-preset-builder@$version" version 2>/dev/null | grep -qx "$version"; then
              echo "dsh-preset-builder@$version is visible in the registry"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::dsh-preset-builder@$version was not visible after 10 minutes"

      - name: Pack release asset
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: bundle
        run: npm pack

      # The npm version, the git tag, and the release page are three records of
      # one event, so the release is opened here rather than remembered by hand.
      - name: Open the GitHub Release
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./bundle/package.json').version")"
          asset="bundle/dsh-preset-builder-$version.tgz"
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$asset" --clobber
          else
            gh release create "v$version" "$asset" \
              --title "v$version" --generate-notes --verify-tag
          fi
